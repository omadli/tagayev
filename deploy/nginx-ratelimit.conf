# Tagayev Methods — nginx rate-limit / connection-limit zones
#
# These directives MUST live in nginx's `http {}` context, so this file goes in
# conf.d/ (which nginx includes inside http), NOT in sites-available/.
#
# Install:
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/tagayev-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The matching `limit_req` / `limit_conn` directives are applied per-location in
# deploy/tagayev.uz.conf. Return 429 (not the default 503) so abusive clients are
# easy to spot in the logs and ban with fail2ban (see deploy/fail2ban/).

# Per-IP request-rate zones (key = client IP).
limit_req_zone  $binary_remote_addr  zone=hs_general:10m  rate=20r/s;   # browsing
limit_req_zone  $binary_remote_addr  zone=hs_form:10m     rate=10r/m;   # POST /ariza/
limit_req_zone  $binary_remote_addr  zone=hs_login:10m    rate=20r/m;   # /admin/login/

# Per-IP concurrent-connection zone (slow-loris / connection flood).
limit_conn_zone $binary_remote_addr  zone=hs_conn:10m;

# Status code returned when a limit is exceeded.
limit_req_status  429;
limit_conn_status 429;
