# fail2ban filter — match HTTP 429 (Too Many Requests) in the nginx access log.
#
# Pairs with the [tagayev-nginx-429] jail. Matches the default nginx
# "combined" log format:
#   $remote_addr - $remote_user [$time_local] "$request" $status $bytes ...
#   1.2.3.4 - - [09/Jun/2026:17:00:00 +0500] "POST /ariza/ HTTP/1.1" 429 198 ...

[Definition]
failregex = ^<HOST> -\s+\S+ \[[^]]+\] "(GET|POST|HEAD|PUT|DELETE)[^"]*" 429 \d+
ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
