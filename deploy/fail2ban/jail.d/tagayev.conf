# Tagayev Methods — fail2ban jails (firewall-level IP blocking)
#
# fail2ban watches the nginx logs and bans IPs that trip the rate limits or
# brute-force the admin login, dropping them at the firewall (iptables/nftables)
# so abusive traffic never reaches nginx again.
#
# Install:
#   sudo apt install fail2ban
#   sudo cp deploy/fail2ban/filter.d/tagayev-nginx-429.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/tagayev.conf             /etc/fail2ban/jail.d/
#   sudo systemctl enable --now fail2ban
#   sudo fail2ban-client status                 # list jails
#   sudo fail2ban-client status tagayev-nginx-429   # banned IPs
#   sudo fail2ban-client set tagayev-nginx-429 unbanip 1.2.3.4   # manual unban

[DEFAULT]
# Never ban yourself / the server. Add your office/home IP here.
ignoreip = 127.0.0.1/8 ::1
bantime  = 1h
findtime = 10m
backend  = auto

# --- nginx limit_req trips (logged to error.log by the rate-limit zones) ---
# Uses fail2ban's built-in nginx-limit-req filter.
[nginx-limit-req]
enabled  = true
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
findtime = 1m
maxretry = 10
bantime  = 1h

# --- Repeated 429s in the access log (covers /ariza/ and /admin/login/) ---
[tagayev-nginx-429]
enabled  = true
filter   = tagayev-nginx-429
logpath  = /var/log/nginx/access.log
findtime = 2m
maxretry = 15
bantime  = 1h

# --- Brute-force against Django/admin auth (HTTP 401/403 on auth endpoints) ---
[nginx-http-auth]
enabled  = true
logpath  = /var/log/nginx/error.log

# --- Escalate: long ban for IPs that keep coming back after a ban ---
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 1w
findtime = 1d
maxretry = 3
