# Tagayev Methods — nginx site config
#
# Install:
#   # rate-limit zones first (they live in the http context):
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/tagayev-ratelimit.conf
#   # then this site:
#   sudo cp deploy/tagayev.uz.conf /etc/nginx/sites-available/tagayev.uz.conf
#   sudo ln -s /etc/nginx/sites-available/tagayev.uz.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate — certbot rewrites this file to add the TLS server
# block and the HTTP->HTTPS redirect automatically:
#   sudo certbot --nginx -d tagayev.uz -d www.tagayev.uz
#
# PERF: after certbot runs, enable HTTP/2 on the TLS block it created — the
# landing page pulls 60+ image variants and HTTP/1.1 head-of-line blocking
# makes that slow. In the `listen 443 ssl;` server block add a line:
#   http2 on;                     # nginx >= 1.25
# (older nginx: change the listen line to `listen 443 ssl http2;`)
# Then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Replace tagayev.uz / paths to match your server before installing.

upstream tagayev_app {
    server unix:/run/tagayev/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name tagayev.uz www.tagayev.uz;

    # Allow admin uploads of images and (self-hosted) video files. Django itself
    # does not cap uploaded *file* size, so the edge limit is what matters here.
    # Prefer YouTube/Vimeo URLs for video to keep this low.
    client_max_body_size 100m;

    # Cap concurrent connections per IP (slow-loris / connection floods).
    limit_conn hs_conn 20;

    # --- Proxy headers (inherited by every location that proxy_passes) ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Tells Django (SECURE_PROXY_SSL_HEADER) the original scheme was HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/xml image/svg+xml application/manifest+json;

    # --- Security headers ---
    # X-Frame-Options / X-Content-Type-Options / Referrer-Policy are also set by
    # Django; repeating the static ones at the edge is harmless belt-and-braces.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): the admin's QR-scan-to-fill widget (Certificate.external_url)
    # needs getUserMedia on our own origin. Without it, the browser refuses the
    # camera outright — it won't even show the permission prompt.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # --- Content-Security-Policy (STAGED ROLLOUT — do not skip straight to enforcing) ---
    # A wrong CSP silently breaks fonts, maps, analytics, video embeds and the
    # admin map picker. NOTE: this file is NOT auto-deployed by CI/CD (only the
    # Django app steps are) — editing this comment does nothing on the server
    # until someone copies it over and reloads nginx.
    #
    # Rollout:
    #   1. [DONE — active below] Report-Only header is enabled. It NEVER blocks
    #      anything; it only logs violations to the browser console. (Must stay
    #      one physical line — nginx has no line-continuation inside a quoted
    #      value.) This file is still manually deployed: copy it to the box and
    #      `nginx -t && systemctl reload nginx` for it to take effect.
    #   2. Visit home, a course detail with a video embed, the contact page with
    #      a map embed, and the admin SiteConfig map picker; check DevTools
    #      console on each for "[Report Only]" CSP messages.
    #   3. Fix any surviving violation in the policy (a legitimate external host
    #      this file doesn't know about yet), reload, repeat step 2 until clean.
    #   4. ONLY THEN switch to enforcing: rename the directive on the active line
    #      from Content-Security-Policy-Report-Only to Content-Security-Policy.
    #
    # unpkg.com is intentionally absent — Leaflet is self-hosted (static/vendor/),
    # so the admin map picker needs no CDN.
    #
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru https://*.google-analytics.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://mc.yandex.ru; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com https://maps.google.com https://yandex.com https://yandex.ru https://yandex.uz; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Let's Encrypt HTTP-01 challenge (certbot manages this dir).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # NOTE: nginx `add_header` REPLACES (not merges) inherited headers, so any
    # location with its own add_header must repeat the security headers below or
    # it silently loses them. This matters most on /media/ (untrusted uploads).

    # ----- Static files (collectstatic → staticfiles/, served by nginx) -----
    location /static/ {
        alias /home/ubuntu/tagayev/staticfiles/;
        access_log off;
        # Filenames are content-hashed (ManifestStaticFilesStorage), so a wrong
        # cache can never be served — cache for a year and skip revalidation.
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Serve WhiteNoise's pre-built .gz beside each asset instead of gzipping
        # on the fly (better ratio, no CPU). gzip_static ships with Ubuntu's
        # nginx. For Brotli: `apt install libnginx-mod-brotli`, then uncomment
        # brotli_static — collectstatic already emits the .br files.
        gzip_static on;
        #brotli_static on;
    }

    # ----- Media (user/admin uploads). whitenoise serves STATIC only; nginx
    # must serve MEDIA_ROOT so uploaded images and video_file play. -----
    location /media/ {
        alias /home/ubuntu/tagayev/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        # Re-assert security headers — uploaded files are exactly where
        # MIME-sniffing protection counts.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # camera=(self): the admin's QR-scan-to-fill widget (Certificate.external_url)
    # needs getUserMedia on our own origin. Without it, the browser refuses the
    # camera outright — it won't even show the permission prompt.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ----- Lead form: strict per-IP rate limit (writes DB + sends Telegram) -----
    location = /ariza/ {
        limit_req zone=hs_form burst=5 nodelay;
        proxy_pass http://tagayev_app;
    }

    # ----- Admin login: rate-limited to slow brute-force attempts -----
    # Regex (not a literal = /admin/login/) so the strict hs_login zone still
    # applies after ADMIN_URL is moved to a secret prefix (e.g. the real login
    # becomes /kirma-bu-yerga/login/). A literal match would leave the real
    # login page under the loose hs_general zone. The single-segment [^/]+ mirrors
    # ADMIN_URL's normalised "<prefix>/" shape; regex locations take precedence
    # over the "location /" prefix below.
    location ~ ^/[^/]+/login/?$ {
        limit_req zone=hs_login burst=10 nodelay;
        proxy_pass http://tagayev_app;
    }

    # ----- Everything else (the application) -----
    location / {
        limit_req zone=hs_general burst=40 nodelay;
        proxy_pass http://tagayev_app;
    }
}
