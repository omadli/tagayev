{% load i18n %}
{# ---- Site-wide JSON-LD: EducationalOrganization + LocalBusiness ---- #}
{# Text values run through |escapejs to stay valid inside JSON string literals. #}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["EducationalOrganization", "LocalBusiness"],
  "@id": "{{ request.scheme }}://{{ request.get_host }}/#org",
  "name": "{{ site_config.site_name|default:'Tagayev Methods'|escapejs }}",
  "url": "{{ request.scheme }}://{{ request.get_host }}/",
{% if site_config.logo %}  "logo": "{{ request.scheme }}://{{ request.get_host }}{{ site_config.logo.url }}",
{% elif site_config.og_image %}  "logo": "{{ request.scheme }}://{{ request.get_host }}{{ site_config.og_image.url }}",
{% endif %}{% if site_config.seo_description %}  "description": "{{ site_config.seo_description|escapejs }}",
{% endif %}{% if site_config.phone_primary %}  "telephone": "{{ site_config.phone_primary|escapejs }}",
{% endif %}{% if site_config.email %}  "email": "{{ site_config.email|escapejs }}",
{% endif %}{% if site_config.address %}  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ site_config.address|escapejs }}",
    "addressCountry": "UZ"
  },
{% endif %}{% if site_config.has_geo %}  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "{{ site_config.latitude|escapejs }}",
    "longitude": "{{ site_config.longitude|escapejs }}"
  },
{% endif %}  "sameAs": [{% for s in social_links %}
    "{{ s.url|escapejs }}"{% if not forloop.last %},{% endif %}{% endfor %}
  ]
}
</script>
