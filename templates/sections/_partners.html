{% load i18n %}
{% if partners %}
<div class="bg-alt border-y bd py-5">
  <div class="mx-auto max-w-6xl px-4 lg:px-8">
    <div class="marquee">
      <div class="marquee-track font-display font-bold text-[18px] txt-soft">
        {% for p in partners %}{% if p.website_url %}<a href="{{ p.website_url }}" target="_blank" rel="noopener" class="hover:text-brand-violet-600 transition">{{ p.name }}</a>{% else %}<span>{{ p.name }}</span>{% endif %}{% endfor %}
        {% for p in partners %}{% if p.website_url %}<a href="{{ p.website_url }}" target="_blank" rel="noopener" class="hover:text-brand-violet-600 transition">{{ p.name }}</a>{% else %}<span>{{ p.name }}</span>{% endif %}{% endfor %}
      </div>
    </div>
  </div>
</div>
{% endif %}
