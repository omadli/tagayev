name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # CI — run the Django test suite + checks on every push and pull request.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # No .env in CI (it is gitignored), so settings fall back to their dev
      # defaults. Force DEBUG=True so the security/SSL-redirect block stays off
      # and the suite runs as in local development.
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      # Production-hardening gate: run the security checks the way the live
      # server does (DEBUG=False + real hosts + strong key) and FAIL the build
      # on any warning, so a regression that weakens HSTS/SSL-redirect/secure
      # cookies can never reach main. This env overrides the job-level dev env
      # (DEBUG/SECRET_KEY/ALLOWED_HOSTS) for this step only.
      - name: Deploy hardening check (check --deploy)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-strong-secret-key-not-for-production-abc123"
          ALLOWED_HOSTS: "tagayev.uz,www.tagayev.uz"
          CSRF_TRUSTED_ORIGINS: "https://tagayev.uz,https://www.tagayev.uz"
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity 2

  # ---------------------------------------------------------------------------
  # CD — deploy to the server, but ONLY on push to main and ONLY if tests pass.
  # Connects as the ordinary 'ubuntu' user over SSH with a DEDICATED ed25519
  # deploy key (secrets.DEPLOY_KEY) — not the login password, which would hand
  # every workflow run the whole box. Revoke by deleting that key's line from
  # ~/.ssh/authorized_keys (comment: github-actions-deploy@tagayev).
  # Runs the redeploy steps in-place under /home/ubuntu/tagayev; the final
  # `sudo systemctl restart` relies on passwordless sudo for the ubuntu user.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: test
    # DEPLOY_ENABLED gates CD: this repo is a fork, and its inherited
    # secrets could still point at another site's box. Tests run on every
    # push regardless; set the repo variable DEPLOY_ENABLED=true only once
    # DEPLOY_HOST/USER/KEY and /home/ubuntu/tagayev are this site's.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never interrupt an in-flight deploy
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}   # ubuntu
          key: ${{ secrets.DEPLOY_KEY }}         # dedicated ed25519 deploy key
          port: 22
          command_timeout: 15m
          script: |
            set -e                                    # abort on first failing command
            cd /home/ubuntu/tagayev
            git pull --ff-only
            venv/bin/pip install -r requirements.txt
            venv/bin/python manage.py migrate --noinput
            # --force: django-tailwind-cli's "up to date" check only compares
            # source.css's mtime against the compiled output's — it has no idea
            # templates changed, so without --force it silently no-ops on every
            # deploy that doesn't also touch source.css (i.e. nearly all of them).
            venv/bin/python manage.py tailwind build --force   # BEFORE collectstatic
            venv/bin/python manage.py collectstatic --noinput
            venv/bin/python manage.py compilemo               # .po -> .mo (polib)
            # Landing sections are fragment-cached (5 min) in a DB cache that
            # survives restart — clear it so template/content changes take effect
            # immediately instead of serving stale HTML for up to the TTL.
            venv/bin/python manage.py shell -c "from django.core.cache import caches; caches['fragments'].clear()" || true
            # Pre-generate thumbnails so the first real visitor doesn't pay the
            # Pillow resize/WebP-encode cost (which can 502 a sync worker).
            venv/bin/python manage.py warm_thumbnails || true
            sudo systemctl restart tagayev
